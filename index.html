<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@200;350&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.ico">
    <title>the Augustine Reviewer</title>
    <style>
    body {
        font-family: 'Roboto', sans-serif;
        background-color: whitesmoke;
        margin: 0;
    }
    .title {
        text-align: center;
        margin-top: 50px;
    }
    .strike{
        text-decoration: line-through;
    }
    .subject{
        border:1px solid gray;
        border-radius:10px;
        vertical-align:middle;
        margin-bottom:10px;
        margin-top:20px;
        transition:transform 0.3s ease;
    }
    .working{
        font-weight:bold;
    }
    .center{
        text-align:center;
    }
    .subject:hover{
        cursor:pointer;
        transform:scale(1.2);
    }
    @media (max-width: 600px) {
        table, thead, tbody, tr{
            display: block;
            width: 100%;
        }
        .subject{
            display:inline-block;
            width:50%;
            margin-left:25%;
            margin-right:25%;
            box-sizing:border-box;
        }
        .subjectparent{
            display:block;
            width:100%;
            margin-left:0%;
            margin-right:0%;
        }
    }
    @media (min-width:600px){
        .subject{
            display:inline-block;
            width:24%;
            margin-left:5%;
            margin-right:5%;
            box-sizing:border-box;
        }
        .subjectparent{
            display:block;
            width:75%;
            margin-left:25%;
            margin-right:25%;
            height:400px;
        }
    }
    .Filipino{
        background-image:url("phil-flag.jpg");
        background-size:cover;
        background-repeat: no-repeat;
    }
    .English{
        background-image:url("england.jpg");
        background-size:cover;
        background-repeat: no-repeat;
        background-position:center;
    }
    .Science{
        background-image:url("science.jpg");
        background-size:cover;
        background-repeat: no-repeat;
        background-position:center;
    }
    .Math{
        background-image:url("math.jpg");
        background-size:cover;
        background-repeat: no-repeat;
        background-position:center;
    }
    .unhidden.hide{
        opacity:0;
        transform: scale(0.1);
    }
    .unhidden{
        opacity:1;
        transform:scale(1);
        transition:opacity 0.3s ease, transform 0.3s ease;
    }
    .chapterlistparts {
        opacity: 0;
        transform: translateY(-15px);
        transition: opacity 1.2s ease, transform 1.2s ease;
    }
    .chapterlistparts.show {
      opacity: 1;
      transform: translateY(0);
    }
    </style>
</head>
<body>
    <h1 class="title" title="pronounced as au̯.ɡʊsˈtiː.nɛ lolololol">The Augustine Reviewer</h1>
    <div id="reviewer" class="center"></div>
    <div style="overflow-x:auto;" class="unhidden" id="Tableholder">
    <table style="border-collapse:collapse; width:100%">
        <tr class="subjectparent"> <!--language et cetera-->
            <td class="subject English" onclick="subject('English')">
                <h1 class="center">English</h1>
                <ul>
                    <li class="working">Term 1</li>
                    <li class="strike">Term 2</li>
                    <li class="strike">Term 3</li>
                </ul>
            </td>
            <td class="subject Filipino">
                <h1 class="center">Filipino</h1>
                <ul>
                    <li class="working">Term 1</li>
                    <li class="strike">Term 2</li>
                    <li class="strike">Term 3</li>
                </ul>
            </td>
            <td class="subject Science">
                <h1 class="center">Science</h1>
                <ul>
                    <li class="working">Term 1</li>
                    <li class="strike">Term 2</li>
                    <li class="strike">Term 3</li>
                </ul>
            </td>
            <td class="subject Math">
                <h1 class="center">Math</h1>
                <ul>
                    <li class="working">Term 1</li>
                    <li class="strike">Term 2</li>
                    <li class="strike">Term 3</li>
                </ul>
            </td>
        </tr>
    </table>
    </div>
    <script>
        
        var table = document.getElementById("Tableholder");
        var reviewer = document.getElementById("reviewer");
        var rTitle, rPG, termlist, chaptertext, subjectreturn, AnkiNotes; //Reviewers Title and Paragraph, which will accept HTML as input, that would be a security risk but not really because you cant hack anything here
        //only set variables globally for stuff that appears once, i.e. termlist/chaptertext, but for now only ONE CHAPTERLIST, i may change depending on my opinion
        var showingchapter=false;
        async function review(given){
            table.remove();
            var getJSON = await fetch(given+'.json');
            data = await getJSON.json()
            console.log(data);
            reviewer.innerHTML="</div><h2 class='center'>"+data.Title+"</h1>"
            termlist = document.createElement("ul");
            for (let i = 0; i < data.term.length; i++) { //creates the terms
                let chapterlist = document.createElement("ul")
                let term = document.createElement('li');
                let termText = document.createElement('span'); //thats the part that shows the Term
                termText.textContent = "Term "+Number(i+1)+" ↑";
                term.appendChild(termText);
                term.style.cursor = "pointer"
                term.style.paddingLeft = "10"
                term.style.listStylePosition = "inside"
                term.style.textAlign = "left"
                term.setAttribute('term',i);
                term.addEventListener('click',() => { //term click event
                    if (!term.getAttribute("showingchapterlist")) { //if term is clicked and not showing chapter
                        console.log('term '+Number(i+1)+' was clicked');
                        term.setAttribute('showingchapterlist',true); //prevents duplication of chapters
                        termText.textContent = "Term "+Number(i+1)+" ↓"; //shows Term # with down character
                        for (let chapindex = 0; chapindex < data.term[i].Chapters.length; chapindex++) { 
                        //creates chapters
                            let chaptername = data.term[i].Chapters[chapindex].Title
                            let chapterlistpart = document.createElement("li");
                            if(Object.hasOwn(data.term[i].Chapters[chapindex], "Anki")){ //HAS ANKI NOTES
                                chapterlistpart.innerHTML = chaptername+'<img src="anki.jpeg" style="height: 1em; vertical-align: middle;"> ';
                                chapterlistpart.setAttribute("hasAnki",true);
                                //adds the chapter name AND Anki LOGO
                            } else { //NO ANKI
                                chapterlistpart.innerHTML = chaptername; 
                                //adds the chapter name only
                            }
                            chapterlistpart.style.paddingLeft='2'
                            chapterlistpart.style.textAlign = "left"
                            chapterlistpart.style.listStylePosition='outside'
                            chapterlistpart.classList.add('chapterlistparts')
                            chapterlistpart.addEventListener('click',() => {
                                if (event.target === event.currentTarget && !chapterlistpart.getAttribute("showingchaptertext")){ //detect chapter list click
                                    if(showingchapter==true){//if different chapter, change text
                                        chapterlistpart.setAttribute("showingchaptertext",true);
                                        chaptertext.innerHTML = data.term[i].Chapters[chapindex].htmltext
                                    } else {
                                        chaptertext = document.createElement('div');
                                    }
                                    chaptertext.style.width='63%';
                                    chaptertext.style.display="inline-block"
                                    chaptertext.style.marginRight='10%'
                                    chapterlistpart.setAttribute("showingchaptertext",true);
                                    chaptertext.innerHTML = data.term[i].Chapters[chapindex].htmltext
                                    termlist.style.marginLeft='0'
                                    termlist.style.marginRight='5%' // RETURNS THE LIST BACK TO LEFT
                                    console.log('Chapter '+chaptername+' was clicked')
                                    showingchapter=true;
                                    [...chapterlist.children].filter(child => child !== chapterlistpart).forEach(sibling=>{
                                        sibling.removeAttribute("showingchaptertext")
                                    })
                                    reviewer.appendChild(chaptertext)
                                }
                            })
                            chapterlist.appendChild(chapterlistpart)
                            setTimeout(() => {
                                chapterlistpart.classList.add('show')
                            }, 10);
                        }
                        chapterlist.style.maxHeight = '0px';
                        chapterlist.style.overflow = 'hidden';
                        chapterlist.style.transition = 'max-height 0.5s ease'; //i used ai for this what the hell is with CSS
                        term.appendChild(chapterlist); //add chapter list
                        setTimeout(() => {
                            chapterlist.style.maxHeight = chapterlist.scrollHeight + 'px';
                        }, 10);
                    } else if (event.target === event.currentTarget || event.target === termText && term.getAttribute("showingchapterlist")) { //if click term and is showing chapter list
                        //reviewer.removeChild(chaptertext); hides chaptertext when hiding chapter list
                        term.removeAttribute("showingchapterlist")
                        termText.textContent = "Term "+Number(i+1)+" ↑";
                        setTimeout(() => {
                            chapterlist.style.maxHeight = chapterlist.scrollHeight + 'px'; // set current height
                            setTimeout(() => {
                                chapterlist.style.maxHeight = '0px'; // animate to 0
                                chapterlist.style.overflow = 'hidden';
                                chapterlist.style.transition = 'max-height 0.5s ease';
                                [...chapterlist.children].forEach(child=>{
                                    child.classList.remove('show')
                                    setTimeout(() => {
                                        child.remove();
                                    }, 500);
                                })
                            }, 20);
                        }, 10);
                        //term.removeChild(chapterlist) //removes the chapterlist of said term

                    }
                })
                termlist.appendChild(term); //add term list
            }
            termlist.style.width="20%";
            termlist.style.border="2px black solid"
            termlist.style.borderRadius = "5px"
            termlist.style.display = 'inline-block'
            termlist.style.marginRight='78%' // ensures the termlist is at the left
            termlist.style.verticalAlign='top'
            termlist.style.paddingLeft='4px'
            termlist.style.paddingRight='5px'
            termlist.style.listStylePosition='inside'

            //create return to the subject table
            subjectreturn = document.createElement('li');
            subjectreturn.style.cursor = "pointer"
            subjectreturn.style.paddingLeft = "10"
            subjectreturn.style.listStylePosition = "inside"
            subjectreturn.style.textAlign = "left"
            subjectreturn.textContent = "return to subject";
            subjectreturn.setAttribute('onclick','location.reload()')
            reviewer.appendChild(termlist)
            termlist.appendChild(subjectreturn)
        }
        
        function subject(given){
            table.classList.add("hide");
            reviewer.innerHTML = "Loading "+given+"..."
            setTimeout(() => review(given), 360);
        }
        async function AnkiParse(ankitextlink, removedupes){//if anki notes are one of those back/front to front/back duplicates, and if reversedupe is set to true, then dupes will be removed
            var ParseAnki = await fetch('anki/'+ankitextlink);
            ParseAnki = await ParseAnki.text();
            ParseAnki = ParseAnki.split("\n")
            AnkiNotes = [];
            var i = 0;
            for(let line of ParseAnki) {
                line = line.split('	');
                await AnkiNotes.push({
                    front:line[0],
                    back:line[1]
                });
                //console.log(line[0], i)
                if(line[0].startsWith("#") || line==''){
                    delete ParseAnki[i];//deletes the #
                    AnkiNotes.splice(i,1) //deletes, it took me around an hour to realize this and the waste of all my claude ai for the day
                } else { //normal
                    i++
                }
            };
            if(removedupes){ //dupes mean notes which have the front back switched - i often use it so thats why
                var duplicatenotelist = [];
                for(let originalnote = 0; originalnote < AnkiNotes.length; originalnote++){
                    for(let notecheck = originalnote; notecheck < AnkiNotes.length; notecheck++){
                        if(duplicatenotelist.includes(notecheck)) continue; //skips known duplicates
                        if(AnkiNotes[originalnote].front==AnkiNotes[notecheck].back && AnkiNotes[originalnote].back==AnkiNotes[notecheck].front){
                            duplicatenotelist.push(notecheck)
                        }
                    }
                }
                duplicatenotelist.reverse();
                duplicatenotelist.forEach(duplicated => {
                    AnkiNotes.splice(duplicated-1,1)
                });
                console.log(AnkiNotes)
            }
        }
    </script>
</body>
</html>
