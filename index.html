<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@200;350&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
        font-family: 'Roboto', sans-serif;
        background-color: whitesmoke;
        margin: 0;
    }
    .title {
        text-align: center;
        margin-top: 50px;
    }
    .strike{
        text-decoration: line-through;
    }
    .subject{
        border:1px solid gray;
        border-radius:10px;
        vertical-align:middle;
        margin-bottom:10px;
        margin-top:10px;
        transition:transform 0.3s ease;
    }
    .working{
        font-weight:bold;
    }
    .center{
        text-align:center;
    }
    .subject:hover{
        cursor:pointer;
        transform:scale(1.2);
    }
    @media (max-width: 600px) {
        table, thead, tbody, tr{
            display: block;
            width: 100%;
        }
        .subject{
            display:inline-block;
            width:50%;
            margin-left:25%;
            margin-right:25%;
            box-sizing:border-box;
        }
        .subjectparent{
            display:block;
            width:100%;
            margin-left:0%;
            margin-right:0%;
        }
    }
    @media (min-width:600px){
        .subject{
            display:inline-block;
            width:24%;
            margin-left:5%;
            margin-right:5%;
            box-sizing:border-box;
        }
        .subjectparent{
            display:block;
            width:75%;
            margin-left:25%;
            margin-right:25%;
        }
    }
    .Filipino{
        background-image:url("phil-flag.jpg");
        background-size:cover;
        background-repeat: no-repeat;
    }
    .English{
        background-image:url("england.jpg");
        background-size:cover;
        background-repeat: no-repeat;
        background-position:center;
    }
    .Science{
        background-image:url("science.jpg");
        background-size:cover;
        background-repeat: no-repeat;
        background-position:center;
    }
    </style>
</head>
<body>
    <h1 class="title">The Augustine Reviewer</h1>
    <div style="overflow-x:auto;">
    <table style="border-collapse:collapse; width:100%">
        <tr class="subjectparent"> <!--language et cetera-->
            <td class="subject English">
                <h1 class="center">English</h1>
                <ul>
                    <li class="working">Term 1</li>
                    <li class="strike">Term 2</li>
                    <li class="strike">Term 3</li>
                </ul>
            </td>
            <td class="subject Filipino">
                <h1 class="center">Filipino</h1>
                <ul>
                    <li class="working">Term 1</li>
                    <li class="strike">Term 2</li>
                    <li class="strike">Term 3</li>
                </ul>
            </td>
            <td class="subject Science">
                <h1 class="center">Science</h1>
                <ul>
                    <li class="working">Term 1</li>
                    <li class="strike">Term 2</li>
                    <li class="strike">Term 3</li>
                </ul>
            </td>
            <td class="subject">
                <h1 class="center">Math</h1>
                <ul>
                    <li class="working">Term 1</li>
                    <li class="strike">Term 2</li>
                    <li class="strike">Term 3</li>
                </ul>
            </td>
        </tr>
    </table>
    </div>
</body>
</html>
